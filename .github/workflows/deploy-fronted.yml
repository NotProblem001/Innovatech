name: CI/CD Frontend Innovatech

on:
  push:
    branches: [ "main", "deploy" ]
    paths:
      - "front_despacho/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push a Docker Hub
      env:
        REPO: ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend
      run: |
        cd front_despacho
        docker build -t $REPO:latest .
        docker push $REPO:latest

    - name: Despliegue en EC2 Frontend (CD)
      uses: appleboy/ssh-action@v1.0.3
      env:
        REPO: ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend
        D_USER: ${{ secrets.DOCKER_USERNAME }}
        D_PASS: ${{ secrets.DOCKER_PASSWORD }}
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: REPO, D_USER, D_PASS
        script: |
          echo "$D_PASS" | docker login -u "$D_USER" --password-stdin
          docker stop frontend-app || true
          docker rm frontend-app || true
          docker pull $REPO:latest
          docker run -d --name frontend-app --restart always -p 80:80 $REPO:latest