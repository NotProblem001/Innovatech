name: CI/CD Backend Ventas Innovatech

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "back-Ventas_SpringBoot/**" # Solo reacciona a cambios en Ventas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Solo si usas AWS Academy
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y Subir Imagen Docker (Build & Push)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: innovatech-backend-ventas
        IMAGE_TAG: latest
      run: |
        # Entramos a la subcarpeta donde está el pom.xml y el Dockerfile
        cd back-Ventas_SpringBoot/Springboot-API-REST
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Despliegue en Instancia EC2 Backend (CD)
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: innovatech-backend-ventas
        IMAGE_TAG: latest
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }} # IP Privada de la EC2 Backend (o Pública si pasas por Bastion/VPN)
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY, ECR_REPOSITORY, IMAGE_TAG
        script: |
          # Autenticar Docker dentro de la EC2 con ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Detener y eliminar el contenedor viejo
          docker stop backend-ventas || true
          docker rm backend-ventas || true
          
          # Descargar la nueva imagen
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Levantar el nuevo contenedor conectado a la base de datos
          docker run -d --name backend-ventas \
            --restart always \
            -p 8080:8080 \
            -e DB_URL=${{ secrets.DB_URL }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG