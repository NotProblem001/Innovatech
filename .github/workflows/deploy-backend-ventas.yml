name: CI/CD Backend Ventas

on:
  push:
    branches: [ "main" ]
    paths:
      - "back-Ventas_SpringBoot/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push a Docker Hub
      env:
        REPO: ${{ secrets.DOCKER_USERNAME }}/innovatech-backend-ventas
      run: |
        cd back-Ventas_SpringBoot/Springboot-API-REST
        docker build -t $REPO:latest .
        docker push $REPO:latest

    - name: Despliegue en EC2 Privada (CD vía Bastion)
      uses: appleboy/ssh-action@v1.0.3
      env:
        REPO: ${{ secrets.DOCKER_USERNAME }}/innovatech-backend-ventas
        D_USER: ${{ secrets.DOCKER_USERNAME }}
        D_PASS: ${{ secrets.DOCKER_PASSWORD }}
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        proxy_host: ${{ secrets.EC2_FRONTEND_HOST }} # Salto a través del Front
        proxy_username: ubuntu
        proxy_key: ${{ secrets.EC2_SSH_KEY }}
        envs: REPO, D_USER, D_PASS
        script: |
          echo "$D_PASS" | docker login -u "$D_USER" --password-stdin
          docker stop backend-ventas || true
          docker rm backend-ventas || true
          docker pull $REPO:latest
          docker run -d --name backend-ventas --restart always -p 8080:8080 -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL }} -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }} -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} $REPO:latest